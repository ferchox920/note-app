syntax = "proto3";

option java_package = "com.noteapp.storage.proto";
option java_multiple_files = true;

message StoredAppPreferences {
  string capture_pipeline_id = 1;
  bool incremental_asr_enabled = 2;
  string incremental_model_id = 3;
  int32 benchmark_thread_count = 4;
  int32 benchmark_chunk_seconds = 5;
  int32 retention_days = 6;
  int32 consent_notice_version = 7;
  int64 consent_acknowledged_at_epoch_ms = 8;
  bool biometric_reauthentication_enabled = 9;
}
