name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: android-actions/setup-android@v3
      - name: Install native toolchain
        run: sdkmanager "ndk;27.1.12297006" "cmake;3.22.1"
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Verify
        shell: bash
        run: |
          set +e
          ./gradlew build lint test --stacktrace 2>&1 | tee gradle-build.log
          gradle_status=${PIPESTATUS[0]}
          if [ "$gradle_status" -ne 0 ]; then
            python - <<'PY'
          from pathlib import Path

          lines = Path("gradle-build.log").read_text(
              encoding="utf-8",
              errors="replace",
          ).splitlines()
          markers = [
              index
              for index, line in enumerate(lines)
              if "dependency verification failed" in line.lower()
          ]
          if markers:
              start = max(0, markers[0] - 5)
              excerpt = "\n".join(lines[start : start + 45])
          else:
              excerpt = "\n".join(lines[-40:])
          escaped = excerpt.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Gradle verification failed::{escaped}")
          PY
          fi
          exit "$gradle_status"
      - name: Verify evidence and evaluation tools
        run: python -m unittest discover -s tools/tests -v
